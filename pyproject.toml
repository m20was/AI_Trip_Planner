[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AI-TRAVEL-PLANNER"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "langchain",
    "langchain-google-genai",
    "langchain_tavily",
    "langgraph",
    "fastapi",
    "uvicorn",
    "streamlit",
    "pydantic",
    "python-dotenv",
    "pyyaml",
    "requests",
    "pytest"
]

[tool.setuptools.packages.find]
where = ["."]
